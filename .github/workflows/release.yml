name: Release

# Push a tag to cut a release:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The tag becomes versionName, and the commit count becomes versionCode. Both
# end up in the bundle that goes to Google Play.
#
# What this does, in order:
#   1. Builds a signed bundle and a signed APK
#   2. Publishes both on the GitHub release page
#   3. Sends the bundle to the Play **internal testing** track, if a service
#      account is configured
#
# It does NOT put anything in front of the public. The internal track is for
# you and the testers you name. Promote it to production from the Play Console
# once you have tried it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the GitHub release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the version needs the tags and the commit count

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore arrives as a base64 secret and exists only for this job.
      # The runner is thrown away afterwards; the cleanup step makes it plain.
      - name: Write the signing file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No KEYSTORE_BASE64 secret. See PLAYSTORE.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > duo-release.jks
          {
            echo "storeFile=duo-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the signed bundle and APK
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Report what was built
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "bundle: $AAB"
          echo "apk:    $APK"
          ls -la "$AAB" "$APK"
          # A release built without a keystore is unsigned and Play will refuse
          # it. Better to fail here than to find out at the upload.
          if ! unzip -l "$APK" >/dev/null 2>&1; then
            echo "::error::the APK is not a valid archive"
            exit 1
          fi

      - name: Publish on the GitHub release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Duo ${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab

      # Internal testing only. Nobody outside the tester list sees this, and
      # promoting it to production stays a deliberate act in the Console.
      #
      # A secret cannot be read in an "if". Reading it there made the whole
      # workflow unreadable to GitHub, and every run failed before it started.
      # It is passed in as a variable, and the step looks at that.
      - name: Send the bundle to the Play internal track
        if: ${{ env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.therealsoftware.duo
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Note that Play was skipped
        if: ${{ env.PLAY_JSON == '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so the bundle was"\
          "not sent to Play. See PLAYSTORE.md for how to set it up."

      - name: Keep the artifacts either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Remove the signing file
        if: always()
        run: rm -f duo-release.jks keystore.properties

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The GitHub runners carry the Android SDK already, so no local.properties
      # is needed here. That file is machine-specific and is not in the repo.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

      # Every push to main also proves the release build still compiles and
      # still signs. Finding that out at tag time, with a release half cut,
      # is the worst moment for it.
      - name: Build the release bundle (unsigned)
        run: ./gradlew :app:bundleRelease

      - name: Say which version this is
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk \
            | head -1 | sed 's/^/::notice::/'

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: duo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
